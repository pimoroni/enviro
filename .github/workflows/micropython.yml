name: MicroPython

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  build:
    name: MicroPython
    runs-on: ubuntu-24.04

    env:
      CI_RELEASE_FILENAME: enviro-${{ github.event.release.tag_name || github.sha }}-micropython
      CI_PROJECT_ROOT: ${{ github.workspace }}/src-${{ github.sha }}
      CI_BUILD_ROOT: ${{ github.workspace }}
      CI_USE_ENV: 1
      TAG_OR_SHA: ${{ github.event.release.tag_name || github.sha }}

    steps:
    - name: Compiler Cache Fixup
      run: |
        mkdir -p /home/runner/.ccache

    - name: "CCache: Restore saved cache"
      uses: actions/cache@v6
      with:
        path: /home/runner/.ccache
        key: ccache-micropython-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ccache-micropython-${{ github.ref }}
          ccache-micropython-

    - name: "Checkout Project"
      uses: actions/checkout@v7
      with:
        submodules: true
        path: ${{ env.CI_PROJECT_ROOT }}

    - name: "Prepare All: Generate cache key"
      shell: bash
      run: |
        echo "CI_CACHE_KEY=`shasum "$CI_PROJECT_ROOT/ci/micropython.sh" | cut -d " " -f 1`" >> $GITHUB_ENV

    - name: "Prepare All: Restore saved cache"
      id: cache-prepare-all
      uses: actions/cache@v6
      with:
        path: ${{ env.CI_BUILD_ROOT }}
        key: prepare-all-${{ env.CI_CACHE_KEY }}
        restore-keys: |
          prepare-all-${{ env.CI_CACHE_KEY }}

    - name: "Install Arm GNU Toolchain (arm-none-eabi-gcc)"
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '13.3.Rel1'

    - name: "Prepare All: Install dependencies"
      if: steps.cache-prepare-all.outputs.cache-hit == 'true'
      shell: bash
      run: |
        source $CI_PROJECT_ROOT/ci/micropython.sh
        ci_install_build_deps
        ci_python_prepare

    - name: "Prepare All: Prepare tools & dependencies"
      if: steps.cache-prepare-all.outputs.cache-hit != 'true'
      shell: bash
      run: |
        source $CI_PROJECT_ROOT/ci/micropython.sh
        mkdir -p $CI_BUILD_ROOT
        ci_install_build_deps
        ci_prepare_all
        ci_python_prepare

    - name: "MicroPython: Configure"
      shell: bash
      run: |
        source $CI_PROJECT_ROOT/ci/micropython.sh
        micropython_version
        ci_cmake_configure

    - name: "MicroPython: Build"
      shell: bash
      run: |
        source $CI_PROJECT_ROOT/ci/micropython.sh
        ci_cmake_build

    - name: "Filesystem: Append Enviro Python files"
      shell: bash
      run: |
        source $CI_PROJECT_ROOT/ci/micropython.sh
        ci_build_filesystem

    - name: "Zip: Build source .zip"
      shell: bash
      run: |
        source $CI_PROJECT_ROOT/ci/micropython.sh
        ci_build_zip

    - name: "Artifacts: Upload .uf2"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.CI_RELEASE_FILENAME }}.uf2
        path: ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}.uf2

    - name: "Artifacts: Upload .uf2 (Filesystem Only)"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.CI_RELEASE_FILENAME }}-filesystem-only.uf2
        path: ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}-filesystem-only.uf2

    - name: "Artifacts: Upload .uf2 (With Filesystem)"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.CI_RELEASE_FILENAME }}-with-filesystem.uf2
        path: ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}-with-filesystem.uf2

    - name: "Artifacts: Upload .zip"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.CI_RELEASE_FILENAME }}.zip
        path: ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}.zip

    - name: "Release: Upload files"
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}.uf2
          ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}-filesystem-only.uf2
          ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}-with-filesystem.uf2
          ${{ env.CI_BUILD_ROOT }}/${{ env.CI_RELEASE_FILENAME }}.zip
